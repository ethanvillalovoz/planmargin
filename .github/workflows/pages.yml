name: Public evidence dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/debugger/package-lock.json
      - name: Install exact frontend dependencies
        working-directory: web/debugger
        run: npm ci
      - name: Verify aggregate-only dashboard
        working-directory: web/debugger
        run: npm test
      - name: Build for GitHub Pages
        working-directory: web/debugger
        run: npm run build -- --base-href=/planmargin/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/debugger/dist/planmargin-debugger/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy aggregate-only site
        id: deployment
        uses: actions/deploy-pages@v4
