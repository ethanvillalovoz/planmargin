name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-free-quality:
    name: Data-free quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Audit Python dependencies
        run: |
          uv export --frozen --all-extras --all-groups --no-hashes --no-emit-project \
            | uvx --from pip-audit==2.10.1 pip-audit \
                --requirement /dev/stdin \
                --progress-spinner off \
                --ignore-vuln PYSEC-2026-3552 \
                --ignore-vuln PYSEC-2026-3553 \
                --ignore-vuln PYSEC-2026-3554 \
                --ignore-vuln GHSA-537c-gmf6-5ccf \
                --ignore-vuln PYSEC-2026-3444

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Build source and native wheel distributions
        run: uv build

      - name: Test core without WOMD credentials
        run: |
          uv run --frozen pytest \
            --ignore=tests/test_torch_trajectory_model.py \
            --ignore=tests/test_tensorrt_qualification.py

      - name: Test isolated PyTorch and ONNX qualification
        run: |
          uv run --frozen pytest \
            tests/test_torch_trajectory_model.py \
            tests/test_tensorrt_qualification.py

  debugger-quality:
    name: Scenario debugger checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web/debugger

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: web/debugger/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck, test, and build
        run: npm run check

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run browser, responsive, and accessibility checks
        run: npm run e2e
