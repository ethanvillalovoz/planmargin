[project]
name = "planmargin"
version = "3.1.0"
description = "Counterfactual stress testing for autonomous-driving planners"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "apache-beam==2.75.0",
  "botorch==0.18.1",
  "duckdb==1.5.5",
  "fastapi>=0.128,<1",
  "optax>=0.2.8,<0.3",
  "scipy>=1.17,<2",
  "uvicorn>=0.40,<1",
  "waymo-waymax @ git+https://github.com/waymo-research/waymax.git@a64dfec9be8576b60d9cecc94f406d9812d4a7d0",
]

[project.scripts]
planmargin-waymax-smoke-test = "planmargin.smoke_test:main"
planmargin-select-scenarios = "planmargin.scenario_selection:main"
planmargin-speed-mutation-smoke-test = "planmargin.speed_mutation:main"
planmargin-controller-comparison = "planmargin.controller_comparison:main"
planmargin-export-rollout-records = "planmargin.rollout_record:main"
planmargin-render-trajectory-comparison = "planmargin.trajectory_visualization:main"
planmargin-validate-lead-braking-family = "planmargin.family_validation:main"
planmargin-run-random-baseline = "planmargin.random_search:main"
planmargin-build-empirical-support = "planmargin.empirical_support:main"
planmargin-report-matched-search-core = "planmargin.matched_search:main"
planmargin-run-matched-search-smoke = "planmargin.matched_smoke:main"
planmargin-check-regression-eligibility = "planmargin.regression_eligibility:main"
planmargin-run-matched-campaign = "planmargin.matched_campaign:main"
planmargin-build-analytics = "planmargin.analytics:main"
planmargin-build-test-operations = "planmargin.test_operations:main"
planmargin-verify-fault-protection = "planmargin.fault_protection:main"
planmargin-verify-assistance-handoff = "planmargin.assistance_handoff:main"
planmargin-build-beam-features = "planmargin.beam_features:main"
planmargin-benchmark-geometry = "planmargin.geometry_benchmark:main"
planmargin-serve-evidence = "planmargin.evidence_api:main"
planmargin-ask-evidence = "planmargin.evidence_assistant:main"
planmargin-build-gaussian-field = "planmargin.gaussian_field:main"
planmargin-retain-proposal-replay = "planmargin.proposal_replay:main"
planmargin-train-rl-controller = "planmargin.rl_controller:main"
planmargin-qualify-shielded-rl-controller = "planmargin.rl_controller_v3:main"
planmargin-train-trajectory-model = "planmargin.trajectory_model:main"
planmargin-train-torch-trajectory = "planmargin.torch_trajectory_model:main"
planmargin-qualify-tensorrt = "planmargin.tensorrt_qualification:main"
planmargin-qualify-fp16-residual = "planmargin.fp16_residual_candidate:main"
planmargin-qualify-active-risk = "planmargin.active_mining:main"
planmargin-qualify-active-risk-v6 = "planmargin.active_mining:v6_main"
planmargin-train-interaction-trajectory = "planmargin.interaction_trajectory_model:main"
planmargin-doctor = "planmargin.workspace:doctor_main"
planmargin-bootstrap-workbench = "planmargin.workspace:bootstrap_workbench_main"
planmargin-bootstrap-sensor = "planmargin.workspace:bootstrap_sensor_main"
planmargin-workbench = "planmargin.debugger_launcher:main"
planmargin-run-experiment = "planmargin.experiment_jobs:main"
planmargin-prepare-planning = "planmargin.planning_setup:main"

[project.optional-dependencies]
assistant = [
  "google-genai==2.17.0",
]
nvidia = [
  "onnx==1.22.0",
  "onnxscript==0.7.1",
]

[dependency-groups]
dev = [
  "httpx2>=2.10,<3",
  "jsonschema>=4.25,<5",
  "onnx==1.22.0",
  "onnxscript==0.7.1",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<0.13",
]

[build-system]
requires = ["pybind11==3.1.0", "setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planmargin = ["*.proto"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# PlanMargin uses eager PyTorch execution for its small trajectory model. Triton
# is a torch.compile backend, is not used by this project, and its Linux wheel
# crashes during import on the supported GitHub runner. Keep that unused
# transitive dependency out of every locked environment.
exclude-dependencies = [
  { package = { name = "torch" }, dependencies = ["triton"] },
]
