[project]
name = "planmargin"
version = "1.1.0"
description = "Counterfactual stress testing for autonomous-driving planners"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "apache-beam==2.74.0",
  "botorch==0.18.1",
  "duckdb==1.5.5",
  "fastapi>=0.128,<1",
  "optax>=0.2.8,<0.3",
  "scipy>=1.17,<2",
  "uvicorn>=0.40,<1",
  "waymo-waymax @ git+https://github.com/waymo-research/waymax.git@a64dfec9be8576b60d9cecc94f406d9812d4a7d0",
]

[project.scripts]
planmargin-waymax-smoke-test = "planmargin.smoke_test:main"
planmargin-select-scenarios = "planmargin.scenario_selection:main"
planmargin-speed-mutation-smoke-test = "planmargin.speed_mutation:main"
planmargin-controller-comparison = "planmargin.controller_comparison:main"
planmargin-export-rollout-records = "planmargin.rollout_record:main"
planmargin-render-trajectory-comparison = "planmargin.trajectory_visualization:main"
planmargin-validate-lead-braking-family = "planmargin.family_validation:main"
planmargin-run-random-baseline = "planmargin.random_search:main"
planmargin-build-empirical-support = "planmargin.empirical_support:main"
planmargin-report-matched-search-core = "planmargin.matched_search:main"
planmargin-run-matched-search-smoke = "planmargin.matched_smoke:main"
planmargin-check-regression-eligibility = "planmargin.regression_eligibility:main"
planmargin-run-matched-campaign = "planmargin.matched_campaign:main"
planmargin-build-analytics = "planmargin.analytics:main"
planmargin-build-beam-features = "planmargin.beam_features:main"
planmargin-benchmark-geometry = "planmargin.geometry_benchmark:main"
planmargin-serve-evidence = "planmargin.evidence_api:main"
planmargin-ask-evidence = "planmargin.evidence_assistant:main"
planmargin-build-gaussian-field = "planmargin.gaussian_field:main"
planmargin-retain-proposal-replay = "planmargin.proposal_replay:main"
planmargin-train-rl-controller = "planmargin.rl_controller:main"
planmargin-train-trajectory-model = "planmargin.trajectory_model:main"
planmargin-doctor = "planmargin.workspace:doctor_main"
planmargin-bootstrap-sensor = "planmargin.workspace:bootstrap_sensor_main"
planmargin-workbench = "planmargin.debugger_launcher:main"

[project.optional-dependencies]
assistant = [
  "google-genai==2.17.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.10,<3",
  "jsonschema>=4.25,<5",
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.13",
]

[build-system]
requires = ["pybind11==3.1.0", "setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planmargin = ["*.proto"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
